# =============================================================================
# BandrewPay — Nginx reverse proxy untuk pay.bandrewstore.com
# -----------------------------------------------------------------------------
# INSTALL (Ubuntu/Debian):
#   1. Pastikan DNS A record pay.bandrewstore.com -> IP server ini
#   2. sudo mkdir -p /var/www/certbot
#   3. sudo cp deploy/nginx/pay.bandrewstore.com.conf \
#        /etc/nginx/sites-available/pay.bandrewstore.com
#      sudo ln -sf /etc/nginx/sites-available/pay.bandrewstore.com \
#        /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#   4. BLOK 443 di bawah masih menunjuk sertifikat yang belum ada — karena itu,
#      NONAKTIFKAN dulu blok 443 (beri komentar) ATAU lebih mudah:
#      dapatkan sertifikat TANPA downtime lewat webroot:
#
#        sudo certbot certonly --webroot -w /var/www/certbot \
#          -d pay.bandrewstore.com --email kamu@bandrewstore.com --agree-tos
#
#   5. Aktifkan kembali blok 443 (hapus komentar), lalu:
#        sudo nginx -t && sudo systemctl reload nginx
#
# RENEWAL: certbot.timer bawaan otomatis pakai webroot yang sama — tanpa
# downtime. Cek dengan: sudo certbot renew --dry-run
#
# JANGAN lupa setelah live:
#   - .env: APP_URL=https://pay.bandrewstore.com
#   - Admin > Pengaturan > app_url ikut diubah/reset (settings DB > env!)
#   - Firewall: buka 80+443, TUTUP 4100 dari publik (sudo ufw deny 4100/tcp)
# =============================================================================

# --- Rate limit perak per IP (lapisan ekstra di atas rate-limit aplikasi) ---
limit_req_zone $binary_remote_addr zone=bp_api:10m rate=20r/s;

server {
    # ---- HTTP: hanya untuk ACME challenge + redirect ke HTTPS ----
    listen 80;
    listen [::]:80;
    server_name pay.bandrewstore.com;

    # Webroot certbot (renewal tanpa downtime)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ---- HTTPS utama ----
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pay.bandrewstore.com;

    # Path standar certbot (webroot di atas)
    ssl_certificate     /etc/letsencrypt/live/pay.bandrewstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.bandrewstore.com/privkey.pem;

    # --- TLS hardening (Mozilla intermediate) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:BP_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — aktifkan SETELAH yakin HTTPS stabil (nilai aman awal 6 bulan)
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Header lain (CSP/X-Frame-Options/dll.) sengaja dikelola oleh aplikasi
    # karena berbeda per-route (admin DENY, halaman bayar embeddable).

    # --- Hardening umum ---
    server_tokens off;
    client_max_body_size 1m;          # payload API kecil (JSON HMAC)
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Tolak metode aneh
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- Proxy ke aplikasi (Next.js di localhost) ---
    upstream bandrewpay {
        server 127.0.0.1:4100;
        keepalive 32;
    }

    # Header proxy di level SERVER agar diwarisi semua location
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;      # <- kunci cookie/CSP adaptif!
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Rate limit ketat khusus API (per IP; app punya limit internal juga)
    location /api/ {
        limit_req zone=bp_api burst=60 nodelay;
        proxy_pass http://bandrewpay;
    }

    # Sisanya (halaman admin, /pay, QR PNG, aset)
    location / {
        proxy_pass http://bandrewpay;
    }

    access_log /var/log/nginx/bandrewpay.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/bandrewpay.error.log warn;
}
